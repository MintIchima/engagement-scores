  { "label": "รวมทั้งหมด", "from": "2026-10-09", "to": "2026-11-03" },
  { "label": "Week 1", "from": "2026-10-09", "to": "2026-10-15" },
  { "label": "Week 2", "from": "2026-10-16", "to": "2026-10-22" },
  { "label": "Week 3", "from": "2026-10-23", "to": "2026-10-29" },
  { "label": "Week 4", "from": "2026-10-30", "to": "2026-11-03" }
];


// ============================================================
// HELPERS
// ============================================================
function toISO(s){
  // DD/MM/YYYY → YYYY-MM-DD
  const m = s.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
}
function toDisplay(iso){
  // YYYY-MM-DD → DD/MM/YYYY (4 หลัก)
  const p=iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
function autoSlash(el){
  let v=el.value.replace(/[^0-9]/g,'');
  if(v.length>2) v=v.slice(0,2)+'/'+v.slice(2);
  if(v.length>5) v=v.slice(0,5)+'/'+v.slice(5);
  el.value=v;
}

// ============================================================
// AGGREGATE
// ============================================================
function aggregate(fromISO, toISO){
  const f=new Date(fromISO), t=new Date(toISO);
  const filtered=RAW.filter(r=>{ const d=new Date(r.date); return d>=f && d<=t; });

  const map={};
  for(const r of filtered){
    const n=r.name;
    if(!map[n]) map[n]={name:n,homeChef:0,foodie:0,lunchbox:0,extraFriend:0,extraTask:0,countLike:0,posts:0,entries:[]};
    map[n].homeChef+=r.homeChef; map[n].foodie+=r.foodie; map[n].lunchbox+=r.lunchbox;
    map[n].extraFriend+=r.extraFriend; map[n].extraTask+=r.extraTask;
    map[n].countLike+=r.countLike; map[n].posts+=1;
    map[n].entries.push(r);
  }

  // Extra Like: rank-1=5pts, rank-2=3pts, others with like>0=1pt
  const persons=Object.values(map);
  const sorted=[...persons].sort((a,b)=>b.countLike-a.countLike);
  persons.forEach(p=>{
    const rank=sorted.findIndex(x=>x.name===p.name);
    p.extraLike = p.countLike===0 ? 0 : rank===0 ? 5 : rank===1 ? 3 : 1;
    p.total=p.homeChef+p.foodie+p.lunchbox+p.extraFriend+p.extraTask+p.extraLike;
  });

  return { persons:persons.sort((a,b)=>b.total-a.total), filtered };
}

function tagHtml(r){
  let t='';
  if(r.homeChef)    t+='<span class="tag tag-hc">Home Chef</span>';
  if(r.foodie)      t+='<span class="tag tag-fd">Foodie</span>';
  if(r.lunchbox)    t+='<span class="tag tag-lb">Lunch Box</span>';
  if(r.extraTask)   t+='<span class="tag tag-et">Extra โจทย์</span>';
  if(r.extraFriend) t+='<span class="tag tag-ef">Extra เพื่อน</span>';
  return t||'<span class="zero">–</span>';
}

// ============================================================
// RENDER
// ============================================================
function renderAll(){
  const fromDisp=document.getElementById('dateFrom').value.trim();
  const toDisp  =document.getElementById('dateTo').value.trim();
  const from=toISO(fromDisp), to=toISO(toDisp);

  document.getElementById('dateFrom').classList.toggle('input-error',!from);
  document.getElementById('dateTo').classList.toggle('input-error',!to);
  if(!from||!to){ document.getElementById('rangeLabel').textContent='รูปแบบวันที่ไม่ถูกต้อง'; return; }
  if(from>to){ document.getElementById('rangeLabel').textContent='วันเริ่มต้นต้องน้อยกว่าวันสิ้นสุด'; return; }

  document.getElementById('rangeLabel').textContent=fromDisp+' – '+toDisp;
  document.getElementById('tableDate').textContent =fromDisp+' – '+toDisp;

  const {persons,filtered}=aggregate(from,to);
  renderPodium(persons);
  renderSummary(persons);
  renderScore(persons);
  renderMenu(filtered);
  highlightTab(from,to);
}

function renderPodium(persons){
  if(!persons.length){document.getElementById('podium').innerHTML='';return;}
  const medals=['🥇','🥈','🥉'],rClass=['rank-1','rank-2','rank-3'];
  const top=persons.slice(0,3);
  const order=top.length>=3?[top[1],top[0],top[2]]:top;
  const ri   =top.length>=3?[1,0,2]:[0,1,2];
  document.getElementById('podium').innerHTML=order.map((p,i)=>`
    <div class="podium-card ${rClass[ri[i]]}">
      <div class="podium-medal">${medals[ri[i]]}</div>
      <div class="podium-name">${p.name}</div>
      <div class="podium-pts">${p.total} <span>pts</span></div>
    </div>`).join('');
}

function renderSummary(persons){
  const tp=persons.reduce((s,p)=>s+p.posts,0);
  const tl=persons.reduce((s,p)=>s+p.countLike,0);
  const topL=persons.reduce((a,b)=>a.countLike>b.countLike?a:b,{name:'-',countLike:0});
  document.getElementById('summaryCards').innerHTML=`
    <div class="s-card"><div class="s-val">${persons.length}</div><div class="s-lbl">คนเข้าร่วม</div></div>
    <div class="s-card"><div class="s-val">${tp}</div><div class="s-lbl">โพสต์รวม</div></div>
    <div class="s-card"><div class="s-val">${tl}</div><div class="s-lbl">Like รวม</div></div>
    <div class="s-card"><div class="s-val">${topL.name}</div><div class="s-lbl">Like สูงสุด (${topL.countLike})</div></div>`;
}

function renderScore(persons){
  if(!persons.length){
    document.getElementById('scoreBody').innerHTML='<tr><td colspan="10" class="no-data">ไม่มีข้อมูลในช่วงนี้</td></tr>';return;
  }
  const rc=['r1','r2','r3'];
  const v=x=>x?x:'<span class="zero">–</span>';
  document.getElementById('scoreBody').innerHTML=persons.map((p,i)=>`
    <tr>
      <td><span class="rank-badge ${rc[i]||'rn'}">${i+1}</span>
          <span class="clickable" onclick="showDetail('${p.name}')">${p.name}</span></td>
      <td class="pts-cell">${p.total}</td>
      <td class="likes-cell">${v(p.extraLike)}</td>
      <td>${v(p.homeChef)}</td><td>${v(p.foodie)}</td><td>${v(p.lunchbox)}</td>
      <td>${v(p.extraFriend)}</td><td>${v(p.extraTask)}</td>
      <td class="likes-cell">${p.countLike}</td><td>${p.posts}</td>
    </tr>`).join('');
  window._personMap={};
  persons.forEach(p=>window._personMap[p.name]=p);
}

function renderMenu(filtered){
  document.getElementById('menuCount').textContent=`${filtered.length} รายการ`;

  // สร้าง name pills
  const names = ['ทั้งหมด', ...new Set(filtered.map(r=>r.name).sort())];
  const bar = document.getElementById('menuFilterBar');
  // เก็บชื่อที่ active ไว้ (ถ้ามี)
  const prevActive = bar.querySelector('.name-pill.active:not(.all)');
  const prevName = prevActive ? prevActive.dataset.name : null;
  // สร้าง pill ใหม่
  bar.innerHTML = '<span class="filter-bar-label">กรองชื่อ:</span>' +
    names.map(n=>`<button class="name-pill ${n==='ทั้งหมด'?'all':''} ${(!prevName&&n==='ทั้งหมด')||prevName===n?'active':''}" data-name="${n}" onclick="filterMenu(this,'${n.replace(/'/g,"\\'")}')"> ${n}</button>`).join('');

  window._menuFiltered = filtered;
  applyMenuFilter(prevName && names.includes(prevName) ? prevName : null);
}

function filterMenu(el, name){
  document.querySelectorAll('.name-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  applyMenuFilter(name==='ทั้งหมด' ? null : name);
}

function applyMenuFilter(name){
  const filtered = window._menuFiltered || [];
  const data = name ? filtered.filter(r=>r.name===name) : filtered;
  const sorted=[...data].sort((a,b)=>b.date.localeCompare(a.date)||a.name.localeCompare(b.name));
  document.getElementById('menuBody').innerHTML = sorted.length
    ? sorted.map(r=>`
        <tr>
          <td class="td-date">${toDisplay(r.date)}</td>
          <td class="td-name">${r.name}</td>
          <td class="td-menu">${r.menu||'–'}</td>
          <td class="td-tags">${tagHtml(r)}</td>
          <td class="td-like">❤️ ${r.countLike}</td>
        </tr>`).join('')
    : '<tr><td colspan="5" class="no-data">ไม่มีข้อมูล</td></tr>';
  document.getElementById('menuCount').textContent=`${sorted.length} รายการ`;
}

function showDetail(name){
  const p=(window._personMap||{})[name];
  if(!p) return;
  document.getElementById('modalName').textContent='📋 '+name;
  document.getElementById('modalBody').innerHTML=p.entries.map(r=>`
    <div class="detail-row">
      <span class="detail-date">${toDisplay(r.date)}</span>
      <span class="detail-menu">${r.menu||'–'}</span>
      ${tagHtml(r)}
      <span class="detail-like">❤️ ${r.countLike}</span>
    </div>`).join('');
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(e){ if(e.target===document.getElementById('modalBg')) document.getElementById('modalBg').classList.remove('open'); }

// ============================================================
// TABS
// ============================================================
function renderTabs(){
  document.getElementById('weekTabs').innerHTML=WEEKS.map((w,i)=>
    `<button class="week-tab ${i===0?'all-tab':''}" id="tab_${i}" onclick="selectWeek(${i})">${w.label}</button>`
  ).join('');
}
function selectWeek(i){
  document.getElementById('dateFrom').value=toDisplay(WEEKS[i].from);
  document.getElementById('dateTo').value  =toDisplay(WEEKS[i].to);
  renderAll();
}
function highlightTab(from,to){
  WEEKS.forEach((w,i)=>{
    const el=document.getElementById('tab_'+i);
    if(el) el.classList.toggle('active',w.from===from&&w.to===to);
  });
}
function applyFilter(){ renderAll(); }

// init — default Week 1
renderTabs();
selectWeek(1);
</script>
</body>
</html>
