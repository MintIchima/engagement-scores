  if(r.foodie)t+='<span class="tag fd">Foodie</span>';
  if(r.lunchbox)t+='<span class="tag lb">Lunch Box</span>';
  if(r.extraTask)t+='<span class="tag et">Extra โจทย์</span>';
  if(r.extraFriend)t+='<span class="tag ef">Extra เพื่อน</span>';
  return t||'<span class="z">–</span>';
}
function v(x){return x?x:'<span class="z">–</span>';}

function calc(f0,t0){
  var f=new Date(f0),t=new Date(t0);
  var fil=RAW.filter(function(r){var d=new Date(r.date);return d>=f&&d<=t;});
  var map={};
  fil.forEach(function(r){
    var n=r.name;
    if(!map[n])map[n]={name:n,hc:0,fd:0,lb:0,ef:0,et:0,lk:0,posts:0,ent:[]};
    map[n].hc+=r.homeChef;map[n].fd+=r.foodie;map[n].lb+=r.lunchbox;
    map[n].ef+=r.extraFriend;map[n].et+=r.extraTask;map[n].lk+=r.countLike;map[n].posts++;
    map[n].ent.push(r);
  });
  var ps=Object.values(map);
  var sl=[].concat(ps).sort(function(a,b){return b.lk-a.lk;});
  ps.forEach(function(p){
    var rk=sl.findIndex(function(x){return x.name===p.name;});
    p.el=p.lk===0?0:rk===0?5:rk===1?3:1;
    p.total=p.hc+p.fd+p.lb+p.ef+p.et+p.el;
  });
  ps.sort(function(a,b){return b.total-a.total;});
  return {ps:ps,fil:fil};
}

function go(){
  var f0=iso(document.getElementById('f').value);
  var t0=iso(document.getElementById('t').value);
  if(!f0||!t0){document.getElementById('msg').textContent='รูปแบบวันที่ไม่ถูกต้อง';return;}
  if(f0>t0){document.getElementById('msg').textContent='วันเริ่มต้นต้องน้อยกว่าสิ้นสุด';return;}
  document.getElementById('msg').textContent='';
  document.getElementById('td2').textContent=document.getElementById('f').value+' – '+document.getElementById('t').value;
  var r=calc(f0,t0);
  drawPod(r.ps);drawCards(r.ps);drawScore(r.ps);drawMenu(r.fil);
  hilite(f0,t0);
  window._fil=r.fil;
}

function drawPod(ps){
  if(!ps.length){document.getElementById('pod').innerHTML='';return;}
  var top=ps.slice(0,3);
  var ord=top.length>=3?[top[1],top[0],top[2]]:top;
  var ri=top.length>=3?[1,0,2]:[0,1,2];
  var md=['🥇','🥈','🥉'],rc=['p1','p2','p3'];
  document.getElementById('pod').innerHTML=ord.map(function(p,i){
    return '<div class="pc '+rc[ri[i]]+'"><div class="pm">'+md[ri[i]]+'</div><div class="pn">'+p.name+'</div><div class="pp">'+p.total+' <span style="font-size:.7rem;color:#a08060;font-weight:400">pts</span></div></div>';
  }).join('');
}

function drawCards(ps){
  var tp=ps.reduce(function(s,p){return s+p.posts;},0);
  var tl=ps.reduce(function(s,p){return s+p.lk;},0);
  var ml=ps.reduce(function(a,b){return a.lk>b.lk?a:b;},{name:'-',lk:0});
  document.getElementById('cards').innerHTML=
    '<div class="card"><div class="cv">'+ps.length+'</div><div class="cl">คนเข้าร่วม</div></div>'+
    '<div class="card"><div class="cv">'+tp+'</div><div class="cl">โพสต์รวม</div></div>'+
    '<div class="card"><div class="cv">'+tl+'</div><div class="cl">Like รวม</div></div>'+
    '<div class="card"><div class="cv">'+ml.name+'</div><div class="cl">Like สูงสุด ('+ml.lk+')</div></div>';
}

function drawScore(ps){
  window._pm={};ps.forEach(function(p){window._pm[p.name]=p;});
  var rc=['r1','r2','r3'];
  if(!ps.length){document.getElementById('sb').innerHTML='<tr><td colspan="10" class="nd">ไม่มีข้อมูล</td></tr>';return;}
  document.getElementById('sb').innerHTML=ps.map(function(p,i){
    return '<tr><td><span class="rb '+(rc[i]||'rn')+'">'+(i+1)+'</span><span class="ck" onclick="detail(''+p.name.replace(/'/g,"\'")+'')">'+ p.name+'</span></td>'+
      '<td class="pts">'+p.total+'</td><td class="lk">'+v(p.el)+'</td>'+
      '<td>'+v(p.hc)+'</td><td>'+v(p.fd)+'</td><td>'+v(p.lb)+'</td>'+
      '<td>'+v(p.ef)+'</td><td>'+v(p.et)+'</td>'+
      '<td class="lk">'+p.lk+'</td><td>'+p.posts+'</td></tr>';
  }).join('');
}

var _mfil=null;
function drawMenu(fil){
  _mfil=fil;
  var names=['ทั้งหมด'].concat([...new Set(fil.map(function(r){return r.name;}).sort())]);
  document.getElementById('fb').innerHTML='<span class="fl">กรองชื่อ:</span>'+
    names.map(function(n){return '<button class="np'+(n==='ทั้งหมด'?' all on':'')+'" onclick="filterM(this,''+n.replace(/'/g,"\'")+'')">'+ n+'</button>';}).join('');
  applyM(null);
}

function filterM(el,n){
  document.querySelectorAll('.np').forEach(function(p){p.classList.remove('on');});
  el.classList.add('on');
  applyM(n==='ทั้งหมด'?null:n);
}

function applyM(name){
  var data=name?_mfil.filter(function(r){return r.name===name;}):_mfil;
  var s=[].concat(data).sort(function(a,b){return b.date.localeCompare(a.date)||a.name.localeCompare(b.name);});
  document.getElementById('mc2').textContent=s.length+' รายการ';
  document.getElementById('mb').innerHTML=s.length?s.map(function(r){
    return '<tr><td class="td">'+disp(r.date)+'</td><td class="tn">'+r.name+'</td><td>'+(r.menu||'–')+'</td><td>'+tags(r)+'</td><td class="lk" style="text-align:center">'+r.countLike+'</td></tr>';
  }).join(''):'<tr><td colspan="5" class="nd">ไม่มีข้อมูล</td></tr>';
}

function detail(name){
  var p=(window._pm||{})[name];if(!p)return;
  document.getElementById('mh').textContent='📋 '+name;
  document.getElementById('md').innerHTML=p.ent.map(function(r){
    return '<div class="dr"><span class="dd">'+disp(r.date)+'</span><span class="dm">'+(r.menu||'–')+'</span>'+tags(r)+'<span class="dl">❤️ '+r.countLike+'</span></div>';
  }).join('');
  document.getElementById('mbg').classList.add('open');
}

function mkTabs(){
  document.getElementById('tabs').innerHTML=WEEKS.map(function(w,i){
    return '<button class="tab'+(i===0?' all':'')+'" id="tab'+i+'" onclick="selW('+i+')">'+ w.label+'</button>';
  }).join('');
}

function selW(i){
  document.getElementById('f').value=disp(WEEKS[i].from);
  document.getElementById('t').value=disp(WEEKS[i].to);
  go();
}

function hilite(f0,t0){
  WEEKS.forEach(function(w,i){
    var el=document.getElementById('tab'+i);
    if(el)el.classList.toggle('on',w.from===f0&&w.to===t0);
  });
}

mkTabs();
selW(1);
</script>
</body></html>
